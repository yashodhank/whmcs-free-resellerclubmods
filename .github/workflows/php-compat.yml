name: PHP compatibility

on:
  push:
    branches: [main, refactor/oss-remove-license-gate, feat/php74-84-compat-v2.19.2]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring

      - name: Syntax check all PHP files
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            php -l "$f" || exit 1
          done

      - name: Zero vendor phone-home
        run: |
          ! rg -n 'rcmodules\.com|preverify\.php|verify\.php|checkip\.php' \
            modules/addons/resellerclubmods_tools includes/hooks widgets || exit 1

      - name: Zero bytecode packaging markers
        run: |
          ! rg -n 'ionCube|SourceGuardian|Zend Guard|eval\s*\(\s*gzinflate' \
            modules/addons/resellerclubmods_tools includes/hooks widgets || exit 1
